schema_version: 1

context:
  name: tango-atk-panel
  version: "7.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://gitlab.com/tango-controls/atk-panel/-/archive/${{ version }}/atk-panel-${{ version }}.tar.gz
  sha256: 654ba63ac9edd8746bc596ca64e2ce81efa29fd482e6887363377a64d2a00027

build:
  number: 0

requirements:
  build:
    - openjdk 17.*
    - maven
  run:
    - openjdk >=17
    - jtango >=9.6.8,<10.0.0
    - tango-atk >=9.3.22

tests:
  - package_contents:
      files:
        - share/java/ATKPanel.jar
        - if: unix
          then: share/java/ATKPanel-${{ version }}.jar
        - if: win
          then: Scripts\atkpanel.bat
      bin:
        - if: unix
          then: atkpanel

about:
  license: LGPL-3.0-or-later
  license_file:
    - LICENSE
    - aggregate-third-party-report.html
  summary: Generic control panel application for Tango
  description: |
    AtkPanel is a generic control panel application.
    It can be used to control any Tango device.
    Tango-Controls is a software toolkit for building control systems.
  homepage: https://www.tango-controls.org
  repository: https://gitlab.com/tango-controls/atk-panel
  documentation: https://tango-controls.readthedocs.io/en/latest/tools-and-extensions/built-in/atkpanel/atkpanel.html

extra:
  recipe-maintainers:
    - beenje
